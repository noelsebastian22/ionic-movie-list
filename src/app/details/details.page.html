<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ movie()?.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if(movie(); as movie){
  <ion-card>
    <div
      [style.height.px]="300"
      [style.backgroundImage]="'url(' + imageBaseUrl + '/w400' + movie.poster_path + ')'"
      [style.backgroundRepeat]="'no-repeat'"
      [style.backgroundPosition]="'top center'"
    ></div>
    <ion-card-header>
      <ion-card-title>{{ movie.title }}</ion-card-title>
      <ion-card-subtitle>{{ movie.tagline }}</ion-card-subtitle>
      <ion-text color="tertiary">
        @for(g of movie.genres; track g.id; let isLast=$last) {
        <ion-badge color="secondary" class="ion-margin-end">
          {{ g.name }}
        </ion-badge>
        @if(!isLast) {
        <span>, </span>
        } }
      </ion-text>
    </ion-card-header>
    <ion-card-content>
      <ion-label color="medium">{{ movie.overview }}</ion-label>
      <ion-item slot="start" lines="none" class="ion-margin-top">
        <ion-label>
          <h3>Release Date</h3>
          <p>{{ movie.release_date | date:'longDate' }}</p>
        </ion-label>
        <ion-badge slot="end" color="primary">
          {{ movie.vote_average }}
        </ion-badge>
      </ion-item>
    </ion-card-content>
  </ion-card>
  }
</ion-content>
